services:
  - type: web
    name: machine-failure-diagnosis-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./data/machine_diagnosis.db
      - key: FRONTEND_URL
        value: https://machine-failure-diagnosis-system.vercel.app
    disk:
      name: kbs-sqlite-storage
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
